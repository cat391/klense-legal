<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klense — Legal</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1c1c1e;
  --muted: #5f6368;
  --rule: #e2e4e8;
  --accent: #0a5ad6;
  --table-head: #f5f6f8;
  --code-bg: #f2f3f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c;
    --fg: #e6e7eb;
    --muted: #a1a5ad;
    --rule: #2e3238;
    --accent: #79b0ff;
    --table-head: #202329;
    --code-bg: #23262c;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, "Helvetica Neue", sans-serif;
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 3rem 1.25rem 5rem;
}
h1 {
  font-size: 2rem;
  line-height: 1.25;
  letter-spacing: -0.02em;
  margin: 0 0 1.25rem;
}
h2 {
  font-size: 1.3rem;
  line-height: 1.3;
  letter-spacing: -0.01em;
  margin: 2.75rem 0 0.75rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--rule);
}
h3 {
  font-size: 1.05rem;
  margin: 1.75rem 0 0.5rem;
}
p, ul, ol { margin: 0 0 1rem; }
ul, ol { padding-left: 1.35rem; }
li { margin-bottom: 0.4rem; }
li > ul { margin-top: 0.4rem; }
a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
strong { font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.875em;
  background: var(--code-bg);
  padding: 0.15em 0.35em;
  border-radius: 4px;
}
.meta {
  color: var(--muted);
  font-size: 0.95rem;
  margin: 0 0 2rem;
}
.table-wrap { overflow-x: auto; margin: 0 0 1.5rem; -webkit-overflow-scrolling: touch; }
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 480px;
  font-size: 0.95rem;
}
th, td {
  border: 1px solid var(--rule);
  padding: 0.6rem 0.75rem;
  text-align: left;
  vertical-align: top;
}
th { background: var(--table-head); font-weight: 600; }
.note { color: var(--muted); font-style: italic; }
.doclinks { list-style: none; padding: 0; }
.doclinks li { margin-bottom: 0.75rem; font-size: 1.05rem; }
@media (max-width: 480px) {
  body { font-size: 16px; }
  main { padding: 2rem 1rem 3.5rem; }
  h1 { font-size: 1.6rem; }
}
</style>
</head>
<body>
<main>
<h1>Klense — Legal</h1>
<p class="meta">Legal documents for the Klense iOS app.</p>
<ul class="doclinks">
<li><a href="privacy.html">Privacy Policy</a></li>
<li><a href="terms.html">Terms of Use</a></li>
</ul>
<p class="note">Klense is operated by Cole Thapanawat, sole proprietor. Questions: <a href="mailto:klensebusiness@gmail.com">klensebusiness@gmail.com</a></p>

</main>
</body>
</html>
